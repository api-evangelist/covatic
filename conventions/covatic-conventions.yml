gaps_for_the_provider:
- No idempotency key on 28 unsafe POST operations.
- No rate-limit headers and no documented limits.
- No request-id/correlation header.
- Only 13 of 71 paths paginated; unbounded collection reads elsewhere.
- Timestamps typed as bare `string` rather than `format: date-time`.
- Mixed snake_case/camelCase property naming between the campaign family and everything else.
