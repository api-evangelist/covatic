summary: >-
  Cross-cutting request/response semantics for the Covatic Audience Builder API,
  computed from the published OpenAPI 3.1.0 and from what the live host actually
  returns. Covatic publishes no written developer guide in public — docs.covatic.io is
  login-gated — so everything here is read off the contract and the wire, not off a
  conventions page. Two things an agent needs are absent and are recorded as absent:
  idempotency and rate-limit signalling.
