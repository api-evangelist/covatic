components:
  schemas:
    CampaignStatus:
      type: string
      enum:
      - Live
      - Draft
      - Completed
      title: CampaignStatus
      description: Campaign status enumeration
    CampaignCreateRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 3
          title: Name
          description: Campaign name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Optional campaign description
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Array of tag names
        type:
          $ref: '#/components/schemas/CampaignType'
          description: Campaign type
        orderId:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Orderid
          description: Client-provided order ID (optional)
        advertiserName:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Advertisername
          description: Advertiser name (optional)
        startDate:
          anyOf:
          - type: string
          - type: 'null'
          title: Startdate
          description: Campaign start date (YYYY-MM-DD), defaults to current date if not provided
        endDate:
          anyOf:
          - type: string
          - type: 'null'
          title: Enddate
          description: Campaign end date (YYYY-MM-DD), defaults to one month from start date if not provided
        platforms:
          items:
            type: string
          type: array
          title: Platforms
          description: Platforms (empty means all platforms)
        status:
          $ref: '#/components/schemas/CampaignStatus'
          description: Campaign status
          default: Draft
        outcomes:
          items:
            $ref: '#/components/schemas/CampaignOutcome'
          type: array
          title: Outcomes
          description: List of campaign outcomes
        outcomePixels:
          items:
            $ref: '#/components/schemas/OutcomePixel'
          type: array
          title: Outcomepixels
          description: List of outcome pixels with tracking codes
        simple_campaign:
          anyOf:
          - $ref: '#/components/schemas/SimpleCampaign'
          - type: 'null'
          description: Simple campaign configuration (required for Simple campaigns)
        smart_campaign:
          anyOf:
          - $ref: '#/components/schemas/SmartCampaign'
          - type: 'null'
          description: Smart campaign configuration (required for Smart campaigns)
        createdBy:
          anyOf:
          - type: string
          - type: 'null'
          title: Createdby
          description: User email of campaign creator (optional, will use JWT sub if not provided)
      type: object
      required:
      - name
      - type
      title: CampaignCreateRequest
      description: Request model for creating a campaign
    Page_str_:
      properties:
        items:
          items:
            type: string
          type: array
          title: Items
        total:
          type: integer
          minimum: 0.0
          title: Total
        page:
          type: integer
          minimum: 1.0
          title: Page
        size:
          type: integer
          minimum: 1.0
          title: Size
        pages:
          type: integer
          minimum: 0.0
          title: Pages
      type: object
      required:
      - items
      - total
      - page
      - size
      - pages
      title: Page[str]
