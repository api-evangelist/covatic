openapi: 3.2.0
info:
  title: Audience builder Campaigns API
  summary: Audience builder is an app for clients to create their campaigns.
  version: 0.0.1
servers:
- url: https://prodaudiencebuilderapi.covatic.io
  description: Production (Covatic Audience Builder)
tags:
- name: Campaigns
paths:
  /api/v1/campaigns/:
    get:
      tags:
      - Campaigns
      summary: Get Campaigns
      description: 'Retrieve a paginated list of campaigns with optional filtering and sorting.


        Supports:

        - Pagination (page, size)

        - Status filtering

        - Search by name, orderId, and audienceCode

        - Filter by tags, platforms, type, creator

        - Date range filtering (by creation date)

        - Multiple sort options'
      operationId: get_campaigns_api_v1_campaigns__get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed)
          default: 1
          title: Page
        description: Page number (1-indexed)
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page (max 100)
          default: 20
          title: Size
        description: Items per page (max 100)
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by status
          title: Status
        description: Filter by status
      - name: sort
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Sort option: latest, oldest, name-ascending, name-descending'
          title: Sort
        description: 'Sort option: latest, oldest, name-ascending, name-descending'
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search in name, orderId, and audienceCode
          title: Search
        description: Search in name, orderId, and audienceCode
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter by tags
          title: Tag
        description: Filter by tags
      - name: platform
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter by platforms
          title: Platform
        description: Filter by platforms
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter by campaign type
          title: Type
        description: Filter by campaign type
      - name: createdBy
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter by creator
          title: Createdby
        description: Filter by creator
      - name: startDate
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by start date
          title: Startdate
        description: Filter by start date
      - name: endDate
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by end date
          title: Enddate
        description: Filter by end date
      - name: parent_type
        in: query
        required: true
        schema:
          type: string
          maxLength: 50
          title: Parent Type
        examples:
          Octave:
            value: company
          Bauer UK:
            value: sub-company
          News UK:
            value: sub-company
      - name: parent_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 50
          title: Parent Name
        examples:
          Octave:
            value: Octave
          Bauer UK:
            value: Bauer UK
          News UK:
            value: News UK
      responses:
        '200':
          description: Get paginated list of campaigns
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Campaigns
      summary: Create New Campaign
      description: "Create a new campaign.\n\nArgs:\n    campaign_data: Campaign creation request body\n\nReturns:\n    Created campaign with generated unique audienceCode and optional orderId\n\nRaises:\n    400: Invalid request body or validation errors\n    409: Campaign with same name already exists"
      operationId: create_new_campaign_api_v1_campaigns__post
      security:
      - HTTPBearer: []
      parameters:
      - name: parent_type
        in: query
        required: true
        schema:
          type: string
          maxLength: 50
          title: Parent Type
        examples:
          Octave:
            value: company
          Bauer UK:
            value: sub-company
          News UK:
            value: sub-company
      - name: parent_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 50
          title: Parent Name
        examples:
          Octave:
            value: Octave
          Bauer UK:
            value: Bauer UK
          News UK:
            value: News UK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
      responses:
        '201':
          description: Create a new campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models__profile__Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/campaigns/created-by:
    get:
      tags:
      - Campaigns
      summary: Get Campaign Created By
      description: "Retrieve unique list of createdBy values from campaigns.\n\nQuery Parameters:\n- parent_id: Filter by company/sub-company ID (from CompanyInfoQueryParams)\n- page: Page number for pagination\n- size: Items per page\n\nReturns:\n    Paginated list of unique createdBy values"
      operationId: get_campaign_created_by_api_v1_campaigns_created_by_get
      security:
      - HTTPBearer: []
      parameters:
      - name: parent_type
        in: query
        required: true
        schema:
          type: string
          maxLength: 50
          title: Parent Type
        examples:
          Octave:
            value: company
          Bauer UK:
            value: sub-company
          News UK:
            value: sub-company
      - name: parent_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 50
          title: Parent Name
        examples:
          Octave:
            value: Octave
          Bauer UK:
            value: Bauer UK
          News UK:
            value: News UK
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Page size
          default: 50
          title: Size
        description: Page size
      responses:
        '200':
          description: Get list of campaign creators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_str_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/campaigns/tracking-url:
    get:
      tags:
      - Campaigns
      summary: Get Tracking Url
      description: "Get the tracking URL based on the parent_id (company or sub-company).\n\nQuery Parameters:\n    parent_id: Company or sub-company name (from CompanyInfoQueryParams)\n\nReturns:\n    Tracking URL for the specified parent with is_default flag\n\nExample Response (specific mapping):\n    {\n        \"status_code\": 200,\n        \"response_type\": \"success\",\n        \"description\": \"Tracking URL retrieved successfully\",\n        \"data\": {\n            \"tracking_url\": \"https://sca-cvc-prod.covatic.io/mobile/api/v1.0\",\n            \"is_default\": false\n        }\n    }\n\nExample Response (default/fallback):\n    {\n        \"status_code\": 200,\n        \"response_type\": \"success\",\n        \"description\": \"Tracking URL retrieved successfully\",\n        \"data\": {\n            \"tracking_url\": \"https://mobile-cvc-fra-cvc-dev.covatic.io/mobile/api/v1.0\",\n            \"is_default\": true\n        }\n    }"
      operationId: get_tracking_url_api_v1_campaigns_tracking_url_get
      security:
      - HTTPBearer: []
      parameters:
      - name: parent_type
        in: query
        required: true
        schema:
          type: string
          maxLength: 50
          title: Parent Type
        examples:
          Octave:
            value: company
          Bauer UK:
            value: sub-company
          News UK:
            value: sub-company
      - name: parent_id
        in: query
        required: true
        schema:
          type: string
          maxLength: 50
          title: Parent Name
        examples:
          Octave:
            value: Octave
          Bauer UK:
            value: Bauer UK
          News UK:
            value: News UK
      responses:
        '200':
          description: Get tracking URL for the parent company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models__profile__Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/campaigns/{campaignId}/insights/summary:
    get:
      tags:
      - Campaigns
      summary: Get Campaign Insights Summary
      operationId: get_campaign_insights_summary_api_v1_campaigns__campaignId__insights_summary_get
      security:
