components:
  schemas:
    NestedTraits:
      properties:
        nested_traits:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Nested Traits
        exclusions:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Exclusions
        locations:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Locations
        platforms:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Platforms
      type: object
      title: NestedTraits
      examples:
      - exclusions:
        - source: covatic
          trait: Contextual|Connectivity|Vauxhall driver
          trait_code: REL660824
        locations:
        - name: London, England
          postcode: UKI
        - name: South East, England
          postcode: UKJ
        nested_traits:
        - traits:
          - source: acorn
            trait: CHANNEL PREFERENCE|Get info/marketing from car dealership or manufacturer|Email
            trait_code: PROCHANNEL PREFERENCE|Get info/marketing from car dealership or manufacturer|Email
        - operator: AND
          traits:
          - source: acorn
            trait: POPULATION (16+)|Ethnicity|Black
            trait_code: PROPOPULATION (16+)|Ethnicity|Black
        - operator: OR
          traits:
          - source: covatic
            trait: Contextual|Activity|Drivers
            trait_code: REL2054
          - source: covatic
            trait: Contextual|Activity|Commuters
            trait_code: REL2051
        platforms:
        - name: Web
        - name: Mobile
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    models__trait__Response:
      properties:
        status_code:
          type: integer
          title: Status Code
        response_type:
          type: string
          title: Response Type
        description:
          type: string
          title: Description
        data:
          anyOf:
          - {}
          - type: 'null'
          title: Data
      type: object
      required:
      - status_code
      - response_type
      - description
      - data
      title: Response
      example:
        data: Sample data
        description: Operation successful
        response_type: success
        status_code: 200
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
