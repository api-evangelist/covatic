summary: >-
  Covatic serves NO /.well-known/ document from any host it controls. Every canonical
  path was probed on covatic.com, docs.covatic.io, platform.covatic.io and the
  Audience Builder API host, and every one either 404s or is answered by a
  single-page-app catch-all that returns the same 1,193-byte HTML shell for any path
  (platform.covatic.io). The only real discovery document reachable for Covatic is the
  OpenID Connect configuration of its AWS Cognito user pool, which is served by AWS on
  amazonaws.com rather than by Covatic on a covatic domain. Because of that, NO
  `WellKnown` / `APICatalog` / `SecurityTxt` pointer is emitted in apis.yml: the
  pointer would assert that the provider serves the surface itself, and it does not.
