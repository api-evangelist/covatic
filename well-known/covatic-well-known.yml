off_host_hits:
- name: OpenID Connect discovery (AWS Cognito user pool)
  url: https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_mQWqhJueg/.well-known/openid-configuration
  status: 200
  content_type: application/json
  file: well-known/covatic-openid-configuration.json
  host_owner: amazonaws.com (AWS-hosted Cognito tenant belonging to Covatic)
  why_not_a_pointer: >-
    Real, parseable OIDC metadata for Covatic's own identity tenant — the pool id
    eu-west-2_mQWqhJueg and the Cognito hosted-UI domain `clienttoolsapi` were read out
    of Covatic's own platform bundle at platform.covatic.io, and the API root replies
    "Welcome to Covatic client tools." But AWS serves this document, not Covatic, so it
    does not satisfy a `WellKnown` claim about Covatic's hosts. It IS used as the
    evidence base for authentication/ and scopes/.
gaps_for_the_provider:
- Serve /.well-known/security.txt on covatic.com (RFC 9116) naming a security contact.
- Serve /.well-known/api-catalog (RFC 9727) pointing at the Audience Builder OpenAPI.
- Stop the platform.covatic.io SPA from answering 200 for unknown paths; a soft-200
  catch-all makes every automated discovery check unreliable against that host.
