gaps_for_the_provider:
- Covatic already ships a conversational audience agent inside its own product. Exposing
  the same capability as an MCP server would make it callable from any agent host
  instead of only from Covatic's UI.
- Publish the CVCQL query grammar as JSON Schema; without it, no tool that creates an
  audience profile can have a usable inputSchema.
