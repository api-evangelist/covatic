summary: >-
  Covatic publishes NO MCP server. This file is a derived candidate tool list computed
  from the Audience Builder OpenAPI — what an MCP server over this API would expose if
  Covatic built one. It is deliberately NOT wired as a `MCPServer` pointer in apis.yml,
  because that pointer asserts the provider serves an MCP endpoint and Covatic does not.
