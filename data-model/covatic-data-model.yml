  operations: [onboard_company_api_v1_company_add_post, get_company_data_api_v1_company__id__get, update_company_data_api_v1_company__id__put, delete_company_api_v1_company__id__delete]
  relationships:
  - type: has_many
    target: SubCompany
    via: sub_companies
- name: SubCompany
  schema: SubCompany
  description: Division inside a Company; carries its own permission set and its own clients.
  fields: [sub_company_name, clients, sub_company_permissions]
  relationships:
  - type: has_many
    target: Client
    via: clients
  - type: belongs_to
