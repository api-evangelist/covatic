summary: >-
  Entity-relationship graph for the Covatic Audience Builder API, derived from the 78
  component schemas and the id-reference fields in the 89 published operations. The
  spine is Company -> SubCompany -> Client (the tenant), and everything else hangs off
  the tenant: audience Profiles built from Traits, and Campaigns that activate those
  audiences and measure outcomes. Identifiers are opaque MongoDB-style `_id` strings
  with a sibling `revision_id`, not prefixed ids.
identifiers:
  primary_key_field: _id
  primary_key_type: string (opaque, ObjectId-shaped)
  revision_field: revision_id
  prefixed_ids: false
  tenant_key: client_id
  domain_codes:
  - name: audience_code
    used_by: [SimpleCampaignAudience, SmartCampaignAudience, SmartCampaignSuggestion]
    format: >-
      Per-company, set by Company.audience_code_format — either `numeric_6` or
      `alphanumeric_3`.
  - name: trait_code
    used_by: [Event Traits, Retargeting Traits]
    format: opaque string, used as a path parameter
  - name: user_cognito_id
    used_by: [Users]
    format: AWS Cognito subject identifier
entities:
- name: Company
  schema: Company
  description: Top-level account. Holds permissions, a QuickSight dashboard config, and the audience code format.
