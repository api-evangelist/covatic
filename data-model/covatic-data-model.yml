notes:
- >-
  There is no `Audience` schema. An audience is a Profile (SharedProfile + Metadata)
  that, once activated on a campaign, is referenced only by its `audience_code`. The
  audience object and the campaign's view of it are deliberately different shapes.
- >-
  `query` and `nested_query` on SharedProfile are untyped `object` in the spec. The
  audience query language is versioned as `cvcql_version` but its grammar is not
  published, so an agent cannot construct a profile query from the OpenAPI alone. This
  is the single largest machine-readability gap in the contract.
