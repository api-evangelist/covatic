data_residency:
  claim: Client data is stored in EU, AU or US regions, in line with client requirements.
  source: https://covatic.com/technical/
  corroboration: >-
    The Client schema in the OpenAPI carries country, bucket_name and cluster_reference
    fields, which is consistent with per-tenant regional storage.
  sub_processors:
  - Amazon Web Services EMEA SARL, Luxembourg
  - MongoDB Limited, Ireland
  transfer_basis: UK, the EEA, Switzerland, or another "adequate" location
  source_dpa: https://covatic.com/dpa/
gaps_for_the_provider:
- Publish a trust centre or a security attestation; a privacy-first adtech company with
  no SOC 2 / ISO 27001 and no security.txt is asking buyers to take Article 32 on faith.
- Name the IAB Tech Lab specifications actually implemented, rather than membership alone.
