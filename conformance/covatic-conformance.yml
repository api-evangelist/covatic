- id: openapi
  name: OpenAPI 3.1.0
  conforms: true
  evidence: >-
    A valid, complete OpenAPI 3.1.0 document is served publicly and unauthenticated at
    https://prodaudiencebuilderapi.covatic.io/openapi.json — 71 paths, 89 operations,
