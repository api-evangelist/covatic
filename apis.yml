aid: covatic
name: Covatic
description: >-
  Covatic is a UK-based, B Corp certified advertising technology company providing
  privacy-preserving audience intelligence and addressability for media owners,
  broadcasters, publishers, and advertisers. Its platform uses on-device (edge)
  processing to build audience segments and demographic cohorts without third-party
  cookies, shared user IDs, or personal data leaving the device. Products include
  Covatic Sense for individual-level connected TV (CTV) addressability and
  attribution, a next-generation audience DMP for enrichment, clean-room data
  sharing, retargeting and attribution, plus audio, podcast, and smart-speaker
  targeting. Covatic integrates via the Covatic Tag (no-code tag manager), the
  Covatic SDK (on-device processing), and a server-to-server Covatic API, with
  a Google Ad Manager publishing path and client data stored in EU, AU, or US
  regions to meet local requirements.
