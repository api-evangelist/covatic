apis:
- name: Covatic Audience Builder API
  description: >-
    REST API behind the Covatic client platform (platform.covatic.io) for building and
    operating privacy-preserving audiences and campaigns: audience profiles, traits
    (behavioural, event and retargeting), campaign creation with attribution and
    time-series insights, tags, notes, company/user administration and QuickSight
    insight dashboards. Also exposes an AI audience-builder agent chat endpoint and a
    ChatGPT completions proxy. OpenAPI 3.1.0, 89 operations across 71 paths, FastAPI
    served, bearer-token (AWS Cognito JWT) authenticated.
  humanURL: https://prodaudiencebuilderapi.covatic.io/docs
